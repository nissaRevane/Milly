default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
  database: milly_development

# The test database must never inherit DATABASE_URL: the database name carried by
# the URL overrides the `database:` key, which would point the suite at the
# development database (and let maintain_test_schema!/database_cleaner purge it).
test:
  <<: *default
<% if !ENV["TEST_DATABASE_URL"].to_s.empty? %>
  url: <%= ENV["TEST_DATABASE_URL"] %>
<% else %>
  host: <%= ENV.fetch("DATABASE_HOST", "db") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USER", "milly") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "milly_password") %>
  database: milly_test
<% end %>

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
  database: milly_production
