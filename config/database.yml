default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
  database: milly_development

# The test database must never inherit DATABASE_URL: the database name carried by
# the URL overrides the `database:` key, which would point the suite at the
# development database (and let maintain_test_schema! purge it).
test:
  <<: *default
<% if !ENV["TEST_DATABASE_URL"].to_s.empty? %>
  url: <%= ENV["TEST_DATABASE_URL"] %>
<% else %>
  host: <%= ENV.fetch("DATABASE_HOST", "db") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USER", "milly") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "milly_password") %>
  database: milly_test
<% end %>

# En production la base tourne comme accessoire Kamal sur le meme VPS : elle est
# joignable par son nom de conteneur sur le reseau docker `kamal`. On compose la
# connexion a partir de variables plutot que d'un DATABASE_URL, pour n'avoir qu'un
# seul secret a gerer (POSTGRES_PASSWORD, partage avec l'accessoire).
production:
  <<: *default
  host: <%= ENV.fetch("DATABASE_HOST", "milly-db") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USER", "milly") %>
  password: <%= ENV["POSTGRES_PASSWORD"] %>
  database: <%= ENV.fetch("DATABASE_NAME", "milly_production") %>
